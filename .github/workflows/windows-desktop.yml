name: MAo Studio Windows installer

on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Package MAo Studio Setup.exe
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out MAo repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python for Windows icon
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Convert MAo logo into Windows .ico
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=10,<12"
          python desktop/scripts/create_icon.py
      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Verify desktop JavaScript
        run: node --check desktop/main.cjs
      - name: Build 64-bit Windows installer
        working-directory: desktop
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = "desktop/dist/MAo-Studio-Setup-1.0.0.exe"
          if (-not (Test-Path $installer)) { throw "Windows installer missing: $installer" }
          $file = Get-Item $installer
          if ($file.Length -lt 10000000) { throw "Installer unexpectedly small: $($file.Length) bytes" }
          Write-Host "Installer: $($file.FullName) ($($file.Length) bytes)"
      - name: Save executable as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAo-Studio-Windows-Setup
          path: desktop/dist/MAo-Studio-Setup-1.0.0.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish public Windows download release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mao-studio-v1.0.0
          name: MAo Studio for Windows — v1.0.0
          target_commitish: main
          make_latest: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: desktop/dist/MAo-Studio-Setup-1.0.0.exe
          body: |
            MAo Studio v1.0.0 for 64-bit Windows. Official MAo CMS desktop application.

            Requires Windows 10/11, an internet connection, and authorization through Cloudflare Access.
            Log in with your approved MAo admin email; your CMS and uploaded media remain on the existing web backend.

            This first installer is not digitally code-signed. Windows SmartScreen may warn that the publisher
            is unknown. Only download from the official MAo website or this official GitHub repository.

            Installer file: MAo-Studio-Setup-1.0.0.exe
