plugins {
    id 'com.android.application'
}

android {
    namespace 'org.mkulimaagricultural.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'org.mkulimaagricultural.studio'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('MAO_ANDROID_KEYSTORE') ?: '../build/mao-studio-release.jks')
            storePassword System.getenv('MAO_ANDROID_STORE_PASSWORD') ?: ''
            keyAlias System.getenv('MAO_ANDROID_KEY_ALIAS') ?: 'mao-studio'
            keyPassword System.getenv('MAO_ANDROID_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
